name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Script And Docs
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for specification checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate project and specification
        shell: pwsh
        run: ./ci/Invoke-Local.ps1 -Stage Validate

  regression:
    name: Regression (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for snapshot contract tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture regression sources
        shell: pwsh
        run: |
          python -B -X utf8 ci/snapshot.py create --source "$env:GITHUB_WORKSPACE" --destination "$env:RUNNER_TEMP/stm32-ci-source" --kind WorkingTree
          if ($LASTEXITCODE -ne 0) { throw 'Regression snapshot failed' }

      - name: Run all hardware-free tests with two workers
        shell: pwsh
        env:
          TEST_POWERSHELL: ${{ matrix.shell }}
        run: |
          ./ci/Invoke-Isolated.ps1 -SnapshotDirectory "$env:RUNNER_TEMP/stm32-ci-source" -Workers 2 -PowerShellExe $env:TEST_POWERSHELL -SuiteTimeoutSeconds 600 -RunTimeoutSeconds 1500 -LogDirectory "$env:RUNNER_TEMP/stm32-test-logs"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.shell }}
          path: |
            ${{ runner.temp }}/stm32-ci-source/manifest.json
            ${{ runner.temp }}/stm32-test-logs/*/run.json
            ${{ runner.temp }}/stm32-test-logs/*/results.json
            ${{ runner.temp }}/stm32-test-logs/*/*/result.json
            ${{ runner.temp }}/stm32-test-logs/*/*/stdout.log
            ${{ runner.temp }}/stm32-test-logs/*/*/stderr.log
            ${{ runner.temp }}/stm32-test-logs/*/*/logs/*
          if-no-files-found: warn
          retention-days: 14
