name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Script And Docs
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required files
        shell: pwsh
        run: |
          $required = @(
            'flash.cmd',
            'erase.cmd',
            'forget.cmd',
            'backup.cmd',
            'info.cmd',
            'README.md',
            'LICENSE',
            'CHANGELOG.md',
            'CHANGELOG.en.md',
            'docs/TECHNICAL_SPECIFICATION.md',
            'docs/archive/TECHNICAL_SPECIFICATION_INFO_R2.md',
            'docs/reference/stlink-inventory.md',
            'docs/user-guide.md',
            'docs/testing.md'
          )

          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($missing) {
            throw "Missing required files: $($missing -join ', ')"
          }

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          $files = @(Get-Item flash.cmd) + @(Get-ChildItem tests -Filter '*.ps1' -File)
          foreach ($file in $files) {
            [System.Management.Automation.Language.Parser]::ParseInput(
              (Get-Content -LiteralPath $file.FullName -Raw -Encoding UTF8),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "Syntax errors in $($file.Name): $($errors | Out-String)"
            }
          }

      - name: Validate script version format
        shell: pwsh
        run: |
          $content = Get-Content -LiteralPath 'flash.cmd' -Raw -Encoding UTF8
          if ($content -notmatch '\$VERSION\s*=\s*"(\d+)\.(\d+)\.(\d+)"') {
            throw 'Version string not found or not in Major.Minor.Patch format.'
          }
          Write-Host "Detected script version $($Matches[1]).$($Matches[2]).$($Matches[3])"

      - name: Set up Python for specification checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate specification structure and traceability
        shell: pwsh
        run: python -X utf8 tests/tools/check_spec.py docs/TECHNICAL_SPECIFICATION.md --strict

  regression:
    name: Regression (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run all hardware-free tests
        shell: pwsh
        env:
          TEST_POWERSHELL: ${{ matrix.shell }}
        run: ./tests/Invoke-Tests.ps1 -PowerShellExe $env:TEST_POWERSHELL -LogDirectory "$env:RUNNER_TEMP/stm32-test-logs"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.shell }}
          path: ${{ runner.temp }}/stm32-test-logs
          if-no-files-found: warn
          retention-days: 14
